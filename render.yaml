services:
  - type: web
    name: flux-store
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # "all" hides the entire site from unrecognised IPs.
      # "admin" hides only /admin and leaves the storefront public.
      - key: IP_GATE_SCOPE
        value: all
      # Your laptop's PUBLIC IP (the one your ISP assigns, not 192.168.x.x).
      # Comma-separate to allow more than one, e.g. home, office, hotspot.
      - key: ADMIN_ALLOWED_IPS
        sync: false
